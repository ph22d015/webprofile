media:
- name: gallery
  label: Gallery albums
  input: src/assets/gallery
  output: /src/assets/gallery
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
- name: covers
  label: Blog covers
  input: src/assets/blog
  output: ../../assets/blog
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: illustrations
  label: Site photographs and illustrations
  input: src/assets/site
  output: /src/assets/site
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
- name: cvPdf
  label: Downloadable CV
  input: public/cv
  output: /webprofile/cv
  extensions:
  - pdf
content:
- name: identity
  label: Profile, contact and social links
  type: file
  path: src/data/editor/identity.json
  fields:
  - name: site
    label: Site
    type: object
    fields:
    - name: name
      label: Name
      type: string
      required: true
    - name: shortName
      label: Short name
      type: string
      required: true
    - name: title
      label: Title
      type: string
      required: true
    - name: description
      label: Description
      type: text
      required: true
    - name: role
      label: Role
      type: string
      required: true
    - name: department
      label: Department
      type: string
      required: true
    - name: institution
      label: Institution
      type: string
      required: true
    - name: institutionUrl
      label: Institution url
      type: string
      required: true
    - name: location
      label: Location
      type: string
      required: true
    - name: locale
      label: Locale
      type: string
      required: true
    - name: eyebrow
      label: Eyebrow
      type: string
      required: true
      list: true
    - name: tagline
      label: Tagline
      type: string
      required: true
      list: true
    - name: intro
      label: Intro
      type: text
      required: true
    required: true
  - name: social
    label: Social
    type: object
    fields:
    - name: linkedin
      label: Linkedin
      type: string
    - name: github
      label: Github
      type: string
    - name: scholar
      label: Scholar
      type: string
    - name: researchgate
      label: Researchgate
      type: string
    - name: orcid
      label: Orcid
      type: string
    required: true
  - name: email
    label: Email
    type: object
    fields:
    - name: user
      label: User
      type: string
      required: true
    - name: domain
      label: Domain
      type: string
      required: true
    required: true
  format: json
- name: academic
  label: CV and education
  type: file
  path: src/data/editor/academic.json
  fields:
