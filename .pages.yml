      label: Education
      type: string
      required: true
    - name: research
      label: Research
      type: string
      required: true
    - name: teaching
      label: Teaching
      type: string
      required: true
    - name: talk
      label: Talk
      type: string
      required: true
    - name: award
      label: Award
      type: string
      required: true
    required: true
  - name: coursework
    label: Coursework
    type: object
    fields:
