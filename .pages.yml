      label: Kind
      type: select
      options:
        values:
        - education
        - research
        - teaching
        - talk
        - award
      required: true
    - name: start
      label: Start
      type: string
      required: true
    - name: when
      label: When
      type: string
      required: true
    - name: title
      label: Title
      type: string
      required: true
    - name: org
      label: Org
      type: string
      required: true
